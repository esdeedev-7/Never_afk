<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>By never</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 0px rgba(120,0,20,0));
    transition: filter 3s ease;
  }
  canvas.glow {
    filter:
      drop-shadow(0 0 35px rgba(139, 0, 20, 0.55))
      drop-shadow(0 0 80px rgba(110, 0, 15, 0.4))
      drop-shadow(0 0 140px rgba(90, 0, 10, 0.25));
  }
  .signature {
    position: absolute;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 190, 215, 0.9);
    font-size: 15px;
    letter-spacing: 0.12em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
    text-shadow: 0 0 12px rgba(255, 105, 170, 0.8);
  }
  .signature.show { opacity: 1; }
  .watermark {
    position: absolute;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: 18px;
    color: rgba(255, 210, 225, 0.75);
    font-size: 13px;
    letter-spacing: 0.15em;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.5s ease;
    text-shadow: 0 0 10px rgba(255, 90, 150, 0.7);
  }
  .watermark.show { opacity: 1; }
  .replay {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top, 0px));
    right: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .replay:active { background: rgba(255,255,255,0.18); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="watermark" id="watermark">ESDEE</div>
<div class="signature" id="signature">never_afk</div>
<button class="replay" id="replayBtn">↺ replay</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const signature = document.getElementById('signature');
const watermark = document.getElementById('watermark');

let W = window.innerWidth;
let H = window.innerHeight;

function sizeCanvas() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
  
sizeCanvas();

function heart(a, scale) {
  const x = 16 * Math.pow(Math.sin(a), 3) * scale;
  const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
  return [x, y];
}

const MAX_SCALE = 15.5;

const DURATION_MS = 30000;
const TOTAL_PARTICLES = 90000;
const PHASE1_PARTICLES = Math.floor(TOTAL_PARTICLES * 0.6);

let drawnCount = 0;
let startTime = 0;
let running = true;
let rafId = null;

function rand(min, max) { return Math.random() * (max - min) + min; }
function centerOf() { return [W / 2, H / 2]; }
function heartScreenScale() { return Math.min(W, H) / (MAX_SCALE * 2.6); }

function drawStroke(cx, cy, s, phase2) {
  const a = rand(0, Math.PI * 2);
  const scale = phase2 ? MAX_SCALE * rand(0.97, 1.03) : rand(1, MAX_SCALE);
  let [x, y] = heart(a, scale);
  const ang = Math.atan2(y, x) + rand(phase2 ? -0.3 : -0.5, phase2 ? 0.3 : 0.5);
  const length = phase2 ? rand(8, 30) : rand(3, 12);
  const px = x + length * Math.cos(ang);
  const py = y + length * Math.sin(ang);
  const width = phase2 ? rand(1.3, 2.4) : rand(0.9, 1.8);
  const alpha = phase2 ? rand(0.22, 0.38) : rand(0.11, 0.20);
  const g = phase2 ? rand(70, 140) : rand(30, 80);
  const b = phase2 ? rand(140, 190) : rand(70, 120);

  ctx.strokeStyle = `rgba(255, ${g}, ${b}, ${alpha})`;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(cx + x * s, cy - y * s);
  ctx.lineTo(cx + px * s, cy - py * s);
  ctx.stroke();
}

function draw(now) {
  const [cx, cy] = centerOf();
  const s = heartScreenScale();

  const elapsed = now - startTime;
  const ratio = Math.min(elapsed / DURATION_MS, 1);
  const targetCount = Math.floor(ratio * TOTAL_PARTICLES);

  while (drawnCount < targetCount) {
    drawStroke(cx, cy, s, drawnCount >= PHASE1_PARTICLES);
    drawnCount++;
  }

  if (ratio >= 1) {
    running = false;
    signature.classList.add('show');
    watermark.classList.add('show');
    canvas.classList.add('glow');
    return;
  }
  rafId = requestAnimationFrame(draw);
}

function start() {
  if (rafId) cancelAnimationFrame(rafId);
  signature.classList.remove('show');
  watermark.classList.remove('show');
  canvas.classList.remove('glow');
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  drawnCount = 0;
  running = true;
  startTime = performance.now();
  rafId = requestAnimationFrame(draw);
}

document.getElementById('replayBtn').addEventListener('click', start);

start();
</script>
</body>
</html>
